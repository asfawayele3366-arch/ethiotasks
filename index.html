<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioTasks - ማስታወቂያዎችን በነፃ ያስተዋውቁ</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .main-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        header { background: #ff9800; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .section { border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 8px; background: #fafafa; text-align: left; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-post { background: #ff9800; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .ad-card { border-left: 5px solid #28a745; background: #eef9f0; padding: 12px; margin: 12px 0; border-radius: 4px; text-align: left; }
        .btn-watch { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .dashboard-grid { display: flex; justify-content: space-between; margin-top: 20px; }
        .db-box { width: 48%; padding: 15px; border-radius: 8px; text-align: center; color: white; font-weight: bold; }
        .bg-blue { background: #17a2b8; }
        .bg-green { background: #28a745; }
        .timer-display { font-size: 12px; color: #ff5722; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
<!-- 0. የተጠቃሚዎች መግቢያ እና መመዝገቢያ ሳጥን -->
<div class="section" id="authSection" style="margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px;">
    <h3 id="authTitle">ወደ አካውንትዎ ይግቡ (Login)</h3>
    <form id="loginForm" onsubmit="handleLogin(event)">
        <input type="text" id="loginUsername" placeholder="ዩዘርኔም (Username)" required style="margin-bottom: 10px; width: 90%; padding: 8px;"><br>
        <input type="password" id="loginPassword" placeholder="ፓስወርድ (Password)" required style="margin-bottom: 10px; width: 90%; padding: 8px;"><br>
        <button type="submit" class="btn-post">አሁን ይግቡ</button>
    </form>
    <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
        <input type="text" id="regUsername" placeholder="አዲስ ዩዘርኔም (Username)" required style="margin-bottom: 10px; width: 90%; padding: 8px;"><br>
        <input type="text" id="regPhone" placeholder="የስልክ ቁጥር (Phone)" required style="margin-bottom: 10px; width: 90%; padding: 8px;"><br>
        <input type="password" id="regPassword" placeholder="ፓስወርድ (Password)" required style="margin-bottom: 10px; width: 90%; padding: 8px;"><br>
        <button type="submit" class="btn-post" style="background: #28a745;">አሁን ተመዝገብ</button>
    </form>
    <p style="margin-top: 15px; font-size: 13px;">
        <a href="javascript:void(0)" id="toggleAuthLink" onclick="toggleAuth(true)">አዲስ አካውንት ለመክፈት እዚህ ይጫኑ</a>
    </p>
</div>
<!-- አዲስ ማስታወቂያ ማስጠኛ ፎርም ክፍል -->
<div class="main-container" id="adSection" style="margin-top: 20px; background: white; padding: 20px; border-radius: 8px;">
    <h3>+ አዲስ ማስታወቂያ ማስጠኛ</h3>
    <form id="adForm" onsubmit="submitAdvertisement(event)">
        <input type="text" id="adTitle" placeholder="የማስታወቂያ ርዕስ (ለምሳሌ፦ የኛ ቻናል)" required style="width:100%; padding:8px; margin:5px 0;">
        <input type="url" id="adUrl" placeholder="የማስታወቂያ ሊንክ/URL" required style="width:100%; padding:8px; margin:5px 0;">
        
        <label style="display:block; margin-top:10px; font-weight:bold;">የሶሻል ሚዲያ አይነት ይምረጡ፡</label>
        <select id="mediaType" style="width:100%; padding:8px; margin:5px 0;">
            <option value="YouTube">YouTube ቪዲዮ</option>
            <option value="TikTok">TikTok ቪዲዮ</option>
            <option value="Telegram">Telegram ቻናል</option>
        </select>

        <label style="display:block; margin-top:10px; font-weight:bold;">የእይታ ሰከንድ ይምረጡ፡</label>
        <select id="adDuration" style="width:100%; padding:8px; margin:5px 0;">
            <option value="10">10 ሰከንድ</option>
            <option value="20">20 ሰከንድ</option>
            <option value="40">40 ሰከንድ</option>
            <option value="90">90 ሰከንድ</option>
        </select>

        <label style="display:block; margin-top:10px; font-weight:bold;">ለአንድ ሰራተኛ የሚከፈለውን ዋጋ ይምረጡ (በብር)፡</label>
        <select id="workerPay" style="width:100%; padding:8px; margin:5px 0;">
            <option value="0.10">0.10 ሳንቲም</option>
            <option value="0.25">0.25 ሳንቲም</option>
            <option value="0.50">0.50 ሳንቲም</option>
            <option value="1.00">1.00 ብር</option>
            <option value="2.00">2.00 ብር</option>
            <option value="3.00">3.00 ብር</option>
            <option value="5.00">5.00 ብር</option>
        </select>

        <input type="number" id="totalBudget" placeholder="አጠቃላይ ለማስታወቂያው የተመደበ በጀት (በብር)" required style="width:100%; padding:8px; margin:5px 0;">
        <button type="submit" style="width:100%; padding:10px; background:#ff9800; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">ማስታወቂያውን አሁን ልቀቅ</button>
    </form>
</div>
<script>
// ከGoogle Sheets ያገኘኸውን የWeb App URL ሊንክ እዚህ ጥቅስ ምልክት ውስጥ ተካው
const GOOGLE_SCRIPT_URL = https://script.google.com/macros/s/AKfycbwmqek-eFIUyKfxCfL3D8rXTFKIdfekyQhYQrJU-LXc1KErXwG42_v0XVk2uUoPf5UpVw/exec

function toggleAuth(showRegister) {
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const authTitle = document.getElementById("authTitle");
  const toggleLink = document.getElementById("toggleAuthLink");
  if (showRegister) {
    loginForm.style.display = "none";
    registerForm.style.display = "block";
    authTitle.innerText = "አዲስ አካውንት መመዝገቢያ (Register)";
    toggleLink.innerText = "አካውንት አለዎት? ይግቡ (Login)";
    toggleLink.setAttribute("onclick", "toggleAuth(false)");
  } else {
    loginForm.style.display = "block";
    registerForm.style.display = "none";
    authTitle.innerText = "ወደ አካውንትዎ ይግቡ (Login)";
    toggleLink.innerText = "አዲስ አካውንት ለመክፈት እዚህ ይጫኑ";
    toggleLink.setAttribute("onclick", "toggleAuth(true)");
  }
}
// አዲስ ማስታወቂያ በ 10% ኮሚሽን እና በነጻ መለጠፊያ ህግ
function submitAdvertisement(event) {
    event.preventDefault();
    const loggedInUser = localStorage.getItem("loggedInUser");
    
    if (!loggedInUser) {
        alert("ማስታወቂያ ለመለጠፍ እባክዎ መጀመሪያ ይግቡ!");
        return;
    }

    const title = document.getElementById("adTitle").value;
    const url = document.getElementById("adUrl").value;
    const mediaType = document.getElementById("mediaType").value;
    const workerPay = parseFloat(document.getElementById("workerPay").value); // የብር መጠን (0.10, 1.00, 3.00)
    const duration = document.getElementById("adDuration").value;
    const totalBudget = parseFloat(document.getElementById("totalBudget").value);
    const taskId = "ET-" + Math.floor(100000 + Math.random() * 900000);

    const adData = {
        action: "submitAd",
        username: loggedInUser,
        taskId: taskId,
        title: title,
        url: url,
        mediaType: mediaType,
        workerPay: workerPay,
        duration: duration,
        totalBudget: totalBudget
    };

    // የገባው አካውንት 'admin' ከሆነ ያለምንም ክፍያ በቀጥታ በነጻ ይለጠፋል
    if (loggedInUser === "admin") {
        adData.totalBudget = 0;
        sendAdToGoogleSheets(adData);
    } else {// 1. የሲስተሙን 10% ኮሚሽን በራስ-ሰር ያሰላል
        const commission = totalBudget * 0.10;
        // 2. ዋናውን በጀት እና የ10% ኮሚሽኑን ደምሮ ጠቅላላ የሚከፈለውን ሂሳብ ያወጣል
        const finalAmount = totalBudget + commission;
        
        // 3. የ Chapa አውቶማቲክ ክፍያ መግቢያን (API) በራሱ ጊዜ ይከፍታል
        fetch("https://chapa.co", {
            method: "POST",
            headers: {
                "Authorization": "Bearer CHAPUBK_TEST-NlxmzDY4AG4knODa7ixDGJp6xwH3JXYs", 
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                amount: finalAmount,
                currency: "ETB",
                email: "user@ethiotasks.com",
                tx_ref: taskId, // ክፍያውን ከ Task ID ጋር ያያይዘዋል
                callback_url: "https://github.io", // ክፍያው ሲያልቅ ተጠቃሚው የሚመለስበት ገጽ
                customization: { 
                    title: "EthioTasks Ad Payment", 
                    description: "የ 10% የሲስተም ኮሚሽን ተጨምሯል" 
                }
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success" || data.data) {
                // ማስታወቂያ አስነጋሪውን በቀጥታ ወደ ቻፓ የቴሌብር/ባንክ መክፈያ ገጽ ይወስደዋል!
                window.location.href = data.data.checkout_url;
            } else {
                alert("የክፍያ ሲስተሙን መክፈት አልተቻለም። እባክዎ መረጃውን ያረጋግጡ።");
            }
        })
        .catch(error => alert("በክፍያ ሂደት ላይ ስህተት ተከስቷል!"));

function sendAdToGoogleSheets(adData) {
    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(adData)
    })
    .then(() => {
        alert("ማስታወቂያዎ ሙሉ በሙሉ በራስ-ሰር ፅድቆ ስራ ላይ ውሏል!");
        location.reload();
    })
    .catch(error => console.error("ስህተት፦", error));
}

// ሰራተኛው "ማየት ጀምር" ሲል ሰከንዱን ቆጥሮ ባላንስ የሚጨምር አውቶሜሽን
function startWatchingTask(taskId, videoUrl, duration, rewardAmount) {
    const loggedInUser = localStorage.getItem("loggedInUser");
    if (!loggedInUser) {
        alert("ለመስራት እባክዎ መጀመሪያ ይግቡ!");
        return;
    }

    window.open(videoUrl, "_blank"); // ቪዲዮውን በአዲስ ታብ ይከፍታል
    let timeLeft = parseInt(duration); // የተመረጠው የእይታ ሰከንድ

    alert("ማስታወቂያው ተከፍቷል! እባክዎ ለ " + timeLeft + " ሰከንድ ሳይዘጉ ይቆዩ።");

    countdownTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            clearInterval(countdownTimer);
            // ሰከንዱ ሲያልቅ የተወሰነውን የብር መጠን በራሱ ጊዜ ይጨምራል
            claimTaskReward(loggedInUser, rewardAmount, taskId);
        }
    }, 1000);
}

function claimTaskReward(username, amount, taskId) {
    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "claimReward", username: username, amount: amount, taskId: taskId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            alert(`🎉 እንኳን ደስ አለዎት! ታስኩን ጨርሰዋል። ${amount} ብር ተጨምሮልዎታል። አዲሱ ባላንስዎ፦ ${data.newBalance} ብር ነው።`);
            localStorage.setItem("userBalance", data.newBalance);
            location.reload();
        }
    });
}
function handleRegister(event) {
  event.preventDefault();
  const user = document.getElementById("regUsername").value;
  const phone = document.getElementById("regPhone").value;
  const pass = document.getElementById("regPassword").value;
  
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "cors", 
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "register", username: user, phone: phone, password: pass })
  })
  .then(response => response.json())
  .then(data => {
    alert("🎉 " + data.message);
    toggleAuth(false);
  })
  .catch(error => alert("የመረብ ግንኙነት ችግር አጋጥሟል!"));
}

function handleLogin(event) {
  event.preventDefault();
  const user = document.getElementById("loginUsername").value;
  const pass = document.getElementById("loginPassword").value; 
  
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "login", username: user, password: pass })
  })
  .then(response => response.json())
  .then(data => {
    if(data.status === "success") {
      localStorage.setItem("ethioTasksUser", user);
      document.getElementById("authSection").innerHTML = `<h3>እሺ እባክዎ ደህና መጡ <b>${user}</b> </h3> <p> ቀሪ ሂሳብዎ፦ ${data.balance} ብር </p>`;
    } else {
      alert("⚠️ " + data.message);
    }
  })
  .catch(error => alert("የመረብ ግንኙነት ችግር አጋጥሟል!"));
}

function postAdAutomatically(event) {
  event.preventDefault(); 
  const username = localStorage.getItem("ethioTasksUser"); 
  
  if (!username) {
    alert("⚠️ እባክዎ ማስታወቂያ ለመለጠፍ መጀመሪያ ወደ አካውንትዎ ይግቡ (Login)!");
    return;
  }
  
  const totalBudget = parseFloat(document.getElementById("adBudgetInput").value); 
  
  if (isNaN(totalBudget) || totalBudget <= 0) {
    alert("⚠️ እባክዎ ትክክለኛ የበጀት መጠን ያስገቡ!");
    return;
  }

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "postAd", username: username, adCost: totalBudget })
  })
  .then(response => response.json())
  .then(data => {
    if (data.status === "success") {
      alert("🎉 ማስታወቂያው በተሳካ ሁኔታ ተለጥፏል!\nየቀረው የሂሳብ መጠንዎ፦ " + data.remainingBalance + " ብር");
      window.location.reload(); 
    } else {
      alert("⚠️ ስህተት፦ " + data.message);
    }
  })
  .catch(error => alert("የመረብ ግንኙነት ችግር አጋጥሟል!"));
}// ⏱️ ማስታወቂያ አይቶ ሲጨርስ ብር የሚጨምር ፋንክሽን
function startAdTimer(seconds, adId, rewardAmount) {
  let timeLeft = seconds;
  const timerDisplay = document.getElementById("timer-display-" + adId);
  
  if (timerDisplay) {
    timerDisplay.style.display = "block";
  }

  const countdown = setInterval(() => {
    timeLeft--;
    if (timerDisplay) {
      timerDisplay.innerText = "እባክዎ ለ " + timeLeft + " ሰከንድ ይጠብቁ...";
    }

    if (timeLeft <= 0) {
      clearInterval(countdown);
      if (timerDisplay) {
        timerDisplay.innerText = "ተጠናቋል! ብር በመደመር ላይ...";
      }

      // በአሁኑ ሰዓት ማስታወቂያ እያየ ያለውን ተጠቃሚ ስም ከlocalStorage ማግኘት
      const username = localStorage.getItem("ethioTasksUser");

      if (!username) {
        alert("⚠️ ማሳሰቢያ፦ ብር ለማግኘት መጀመሪያ መግባት (Login) ነበረብዎት!");
        return;
      }

      // ወደ Google Sheets የሂሳብ መጨመሪያ ዳታ መላክ
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "updateBalance", // ቅድም Google Script ላይ የሰራነው አክሽን
          username: username,
          reward: rewardAmount // የሚደመረው የብር መጠን
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          alert("🎉 እንኳን ደስ አለዎት! " + rewardAmount + " ብር ወደ አካውንትዎ ተደምሯል።\nአዲሱ ቀሪ ሂሳብዎ፦ " + data.newBalance + " ብር");
          window.location.reload();
        } else {
          alert("⚠️ ስህተት፦ " + data.message);
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("የመረብ ችግር አጋጥሟል፣ ብሩ አልተደመረም።");
      });
    }
  }, 1000);
</script>
